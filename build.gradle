plugins {
    // update Loom to a recent version that supports 1.21.x
    id 'fabric-loom' version '1.14-SNAPSHOT'

    id 'maven-publish'

    id "me.modmuss50.mod-publish-plugin" version "0.3.5"
    // https://modmuss50.github.io/mod-publish-plugin/
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    flatDir {
        dirs 'deps'
    }
}

version = rootProject.mod_version

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
    }

    // cloth config
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }

    // for sodium
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    // for parchment
    maven {
        url = "https://maven.parchmentmc.org"
    }

    // for cardinal components that gravity changer uses
    maven {
        name = 'Ladysnake'
        url = 'https://maven.ladysnake.org/releases'
    }

    // geckolib, for testing with portal gun
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

loom {
    accessWidenerPath = file("src/main/resources/imm_ptl.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    mappings loom.layered() {
        officialMojangMappings() {
            setNameSyntheticMembers(false)
        }
        // For 1.21.10 you may need a parchment artifact matching 1.21.10. Update if necessary.
        parchment("org.parchmentmc.data:parchment-1.21:2024.07.28")
    }

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}") {
        exclude module: "fabric-gametest-api-v1"
        // for now, the gametest module makes client unable to login dev env server
    }

    // (the remainder is unchanged — uses project props for cloth, sodium, iris, etc.)
    ...
}
