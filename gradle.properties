# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G

org.gradle.parallel=false

# Mod Properties
# don't forget to change changelog.md after bumping version
mod_version=6.0.6
maven_group=qouteall
archives_base_name=immersive-portals

modmenu_version=11.0.1
cloth_config_version=15.0.130
# NOTE: Update the sodium/iris coordinates below to the correct 1.21.10 artifacts on Modrinth/Maven if available.
sodium_path=maven.modrinth:sodium:mc1.21.10-0.6.0-fabric   # placeholder — verify exact artifact
iris_path=maven.modrinth:iris:1.8.0+1.21.10-fabric        # placeholder — verify exact artifact
gravity_changer_version=cd4e3377
dimlib_version=v1.1.0-mc1.21.10                          # placeholder — verify artifact

enable_sodium=true
enable_iris=true
enable_pehkui=false
enable_gravity_changer=false
enable_test_mod=false
enable_geckolib=false

# don't forget to update this if branch changes
git_branch=1.21

# Target game + mappings + loader + fabric api
minecraft_version=1.21.10

# Replace the yarn build number with the exact build from https://maven.fabricmc.net/net/fabricmc/yarn/
yarn_mappings=1.21.10+build.1    # placeholder: pick the exact build number for 1.21.10

# Upgrade loader to a version that explicitly supports 1.21.10
loader_version=0.18.4            # example — confirm release that supports 1.21.10

# Fabric API target for 1.21.10 — pick the release that lists +1.21.10
fabric_version=0.140.0+1.21.10   # example — confirm exact Fabric API release
